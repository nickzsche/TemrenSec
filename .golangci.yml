version: "2"

run:
  timeout: 5m
  tests: true

# A focused, high-signal linter set that the whole codebase passes. gofmt keeps
# formatting consistent; govet/staticcheck catch real bugs; the rest are cheap
# correctness checks. Stricter style/security linters (revive, gocritic, gosec,
# dupl, unparam, prealloc) were intentionally left out — they flag hundreds of
# legacy style issues and would make CI noise rather than signal.
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unconvert
    - misspell
  settings:
    staticcheck:
      # Keep only the SA* bug-detection checks; QF/ST/S style & quickfix
      # categories are noise on this legacy codebase.
      checks:
        - SA*
  exclusions:
    generated: lax
    paths:
      - vendor
      - frontend/node_modules
    rules:
      # The TLS auditor intentionally references deprecated SSLv3/TLS1.0/1.1
      # constants in order to detect servers that still offer them.
      - path: pkg/tlsaudit/
        linters: [staticcheck]
        text: "SA1019"
      # First-party notify package is deprecated but still supported; CLI
      # migration to pkg/notify is tracked separately.
      - linters: [staticcheck]
        text: "pkg/integration/notify is deprecated"

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
