services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: temren
      POSTGRES_PASSWORD: temren
      POSTGRES_DB: temren
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temren"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://temren:temren@postgres:5432/temren?sslmode=disable
      REDIS_URL: redis://redis:6379
      TEMREN_WS_REDIS: redis:6379
      JWT_SECRET: dev-secret-do-not-use-in-production-123!A
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgres://temren:temren@postgres:5432/temren?sslmode=disable
      REDIS_URL: redis://redis:6379
      TEMREN_WS_REDIS: redis:6379
      JWT_SECRET: dev-secret-do-not-use-in-production-123!A
      WORKER_CONCURRENCY: "5"
      SCAN_TIMEOUT: "30"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
      args:
        API_URL: http://api:8080
        NEXT_PUBLIC_WS_URL: ws://localhost:8080
    command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
