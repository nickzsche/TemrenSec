version: "3.8"

# Secrets come from .env, which is generated by `make setup` (or copied from
# .env.example and edited). JWT_SECRET and POSTGRES_PASSWORD deliberately have
# no default: the previous defaults were a 23-character "change-me-in-production"
# and the literal password "temren", and because ENVIRONMENT also defaulted to
# production the API rejected that secret and exited on boot — so the documented
# quickstart could never come up at all. Failing here, with a message naming the
# fix, is better than a crash loop.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temren}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD — run "make setup" to generate .env}
      POSTGRES_DB: ${POSTGRES_DB:-temren}
    # Not published on the host by default; the app containers reach it over the
    # compose network. Uncomment to connect a local client.
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-temren}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Same reasoning as postgres — an exposed Redis with no auth is a standard
    # way self-hosted deployments get taken over.
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    command: temren-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-temren}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD — run "make setup"}@postgres:5432/${POSTGRES_DB:-temren}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to 32+ chars — run "make setup" to generate .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Scan targets resolving to private/loopback/link-local addresses are
      # refused. Set to true only when scanning your own internal hosts.
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      # Fans WebSocket broadcasts across API replicas. Required once you scale
      # the api service beyond one container.
      TEMREN_WS_REDIS: ${TEMREN_WS_REDIS:-redis:6379}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    command: temren-worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-temren}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD — run "make setup"}@postgres:5432/${POSTGRES_DB:-temren}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to 32+ chars — run "make setup" to generate .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      WORKER_CONCURRENCY: "5"
      SCAN_TIMEOUT: "30"
      # The API applies migrations on boot; the worker waits for it rather than
      # racing to apply them itself.
      SKIP_MIGRATIONS: "1"
      METRICS_PORT: "9090"
    ports:
      # Scan metrics live in this process, not the API.
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
