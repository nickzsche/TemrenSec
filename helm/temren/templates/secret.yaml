{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "temren.secretName" . }}
  labels:
    {{- include "temren.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required (generate one with: openssl rand -hex 32) or set secrets.existingSecret" .Values.secrets.jwtSecret | quote }}
  DATABASE_URL: {{ include "temren.databaseUrl" . | quote }}
  REDIS_URL: {{ include "temren.redisUrl" . | quote }}
{{- end }}
