id: exposed-aws-credentials
info:
  name: Exposed AWS Credentials File
  severity: critical
  description: .aws/credentials erişilebilir; bulut anahtarları sızabilir.
  tags: exposure,secret,cloud
  owasp: "A05:2021"
  remediation: Kimlik dosyalarını web kökünden kaldırın, anahtarları döndürün.
requests:
  - method: GET
    path: ["{{BaseURL}}/.aws/credentials"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words: ["aws_access_key_id", "aws_secret_access_key"]
        condition: or
