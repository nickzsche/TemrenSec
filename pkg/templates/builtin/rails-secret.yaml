id: exposed-rails-secrets
info:
  name: Exposed Rails secrets.yml / database.yml
  severity: critical
  description: Rails yapılandırma dosyaları erişilebilir; secret_key_base ve DB kimlikleri sızabilir.
  tags: exposure,secret,rails
  owasp: "A05:2021"
  remediation: config dosyalarını web kökünden kaldırın; sırları döndürün.
requests:
  - method: GET
    path: ["{{BaseURL}}/config/secrets.yml", "{{BaseURL}}/config/database.yml"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex: ["(?i)(secret_key_base|password:|adapter:)"]
